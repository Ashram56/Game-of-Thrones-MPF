#config_version=6
# Visual pass over the modes: each dip switch starts one mode (event_player), shots follow, then the mode is stopped
config:
  - config.yaml
event_player:
  s_dip_1_active: start_mode_hand_of_the_king
  s_dip_1_inactive: stop_mode_hand_of_the_king
  s_dip_2_active: start_mode_targaryen
  s_dip_2_inactive: stop_mode_targaryen
  s_dip_3_active: start_mode_baratheon
  s_dip_3_inactive: stop_mode_baratheon
  s_dip_4_active: start_mode_greyjoy
  s_dip_4_inactive: stop_mode_greyjoy
  s_dip_5_active: start_mode_tyrell
  s_dip_5_inactive: stop_mode_tyrell
  s_dip_6_active: start_mode_martell
  s_dip_6_inactive: stop_mode_martell
  s_dip_7_active: start_mode_iron_throne
  s_dip_7_inactive: stop_mode_iron_throne
switch_player:
  start_event: reset_complete
  steps:
    - time: 0.1s
      switch: s_trough_1
      action: activate
    - time: 0.1s
      switch: s_trough_2
      action: activate
    - time: 0.1s
      switch: s_trough_3
      action: activate
    - time: 0.1s
      switch: s_trough_4
      action: activate
    - time: 0.1s
      switch: s_trough_5
      action: activate
    - time: 0.1s
      switch: s_trough_6
      action: activate
    - time: 12s
      switch: s_left_coin
      action: hit
    - time: 0.3s
      switch: s_start_button
      action: hit
    - time: 5s
      switch: s_shooter_lane
      action: activate
    - time: 1s
      switch: s_shooter_lane
      action: deactivate
    - time: 2s
      switch: s_dip_1
      action: activate
    - time: 8s
      switch: s_dip_1
      action: deactivate

#config_version=6
# Headless display test: mpf game . -c smoke_game  (fills the trough, starts a game, scores through the spinner)
config:
  - config.yaml
switch_player:
  start_event: reset_complete
  steps:
    - time: 0.1s
      switch: s_trough_1
      action: activate
    - time: 0.1s
      switch: s_trough_2
      action: activate
    - time: 0.1s
      switch: s_trough_3
      action: activate
    - time: 0.1s
      switch: s_trough_4
      action: activate
    - time: 0.1s
      switch: s_trough_5
      action: activate
    - time: 0.1s
      switch: s_trough_6
      action: activate
    - time: 3s
      switch: s_left_coin
      action: hit
    - time: 0.3s
      switch: s_start_button
      action: hit
    - time: 4s
      switch: s_tilt_pendulum
      action: hit
    - time: 0.2s
      switch: s_tilt_pendulum
      action: release
    - time: 1.5s
      switch: s_tilt_pendulum
      action: hit

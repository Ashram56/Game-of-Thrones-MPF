#config_version=6
# Stern Game of Thrones LE/Premium 1.37.0 (Spike 1), MPF machine config. Switch/coil/light numbers are the ROM's
# ids (S<id>, C<id>, L<id>, D<idx> for dedicated switches), from game/config/rom/ (generated, scripts/gen_config.py).
# Platform neutral: launch with an overlay, e.g.  mpf game . -c config,hw_virtual
# VERIFICATION: no PinMAME/traces exist for Spike 1; nothing here has been run in MPF (MPF was not installable).

config:
  - rom/switches.yaml
  - rom/coils.yaml
  - rom/lights.yaml
  - rom/settings.yaml
  - rom/sounds.yaml        # sound_player only (GMC registers game/sounds/<track>/<stem>)
  - rom/slides.yaml        # slide_player only (slides are scenes in game/slides/)
  - devices.yaml

modes:
  - attract
  - service
  - tilt
  - extras
  - audits
  - scoring     # fixed switch scores, generated from data/switch_events.csv (Game-of-Thrones docs/08)
  - base
  - targaryen
  - stark
  - baratheon
  - lannister
  - greyjoy
  - tyrell
  - martell
  - winter_is_coming
  - blackwater
  - castle
  - hand_of_the_king
  - iron_throne
  - midnight_madness
  - wall
  - winter_has_come

game:
  balls_per_game: settings.ad_balls_per_game      # service menu: BALLS PER GAME
  max_players: 4

machine:
  balls_installed: 6         # L: six trough switches (S16-S21) plus a jam switch
  min_balls: 1

displays:
  dmd:
    width: 128
    height: 32
    default: true

# Service buttons (D-switches) -> MPF's built-in service mode: select = enter / confirm, back = esc, +/- = up/down.
event_player:
  s_service_select_active: sw_service_enter_active
  s_service_back_active: sw_service_esc_active
  s_service_plus_active: sw_service_up_active
  s_service_minus_active: sw_service_down_active

# Audits (service menu > Audits). MPF's auditor counts switches, shots, player score and these events; the ROM's own
# 207 audit counters (data/audits.csv) are not all mapped yet.
auditor:
  events:
    - game_started
    - game_ended
    - tilt
    - slam_tilt
    - ball_started
    - got_house_complete
    - extra_ball_group_default_awarded
    - got_sound_ball_saved
  player:
    - score

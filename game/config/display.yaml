#config_version=6
# DMD score slide (GMC scene game/slides/score.tscn): shown for the whole game, ROM videos play over it.
slide_player:
  ball_started:
    score:
      priority: 1
  game_ended:
    score:
      action: remove
  got_mystery_menu:
    mystery:
      priority: 50
      tokens:
        top: "{top}"
        middle: "{middle}"
        keep: "{keep}"
      expire: 10s
  got_mystery_cursor:
    mystery:
      priority: 50
      tokens:
        top: "{top}"
        middle: "{middle}"
        keep: "{keep}"
      expire: 10s
  got_mystery_award:
    mystery:
      action: remove
  got_video_mode_state:
    videomode:
      priority: 60
      tokens:
        me: "{me}"
        ai: "{ai}"
      expire: 25s
  got_video_mode_finished:
    videomode:
      action: remove
  got_cyb_menu:
    cyb:
      priority: 55
      tokens:
        label: "{label}"
  got_cyb_done:
    cyb:
      action: remove
  got_screen_a:
    attract_a:
      priority: 80
      tokens:
        line1: "{line1}"
        line2: "{line2}"
        line3: "{line3}"
    attract_b:
      action: remove
  got_screen_b:
    attract_b:
      priority: 80
      tokens:
        line1: "{line1}"
        line2: "{line2}"
        line3: "{line3}"
    attract_a:
      action: remove
  got_screen_clear:
    attract_a:
      action: remove
    attract_b:
      action: remove
machine_vars:
  credits:
    initial_value: 0
    value_type: int
    persist: true
  got_highscores:
    initial_value: ""
    value_type: str
    persist: true
  got_arg_score:
    initial_value: "0"
    value_type: str
    persist: false
  got_arg_award:
    initial_value: "0"
    value_type: str
    persist: false
  got_arg_timer:
    initial_value: "0"
    value_type: str
    persist: false
  got_arg_player:
    initial_value: "1"
    value_type: str
    persist: false
  got_arg_ball:
    initial_value: "1"
    value_type: str
    persist: false
  got_arg_shots:
    initial_value: "0"
    value_type: str
    persist: false
  got_arg_tickle:
    initial_value: "0"
    value_type: str
    persist: false
  got_arg_price:
    initial_value: "0"
    value_type: str
    persist: false
  got_arg_gold:
    initial_value: "0"
    value_type: str
    persist: false
  got_arg_wildfire:
    initial_value: "0"
    value_type: str
    persist: false
